apiVersion: v1
kind: ServiceAccount
metadata:
  name: netcafe-app-sa
  namespace: netcafe
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netcafe-app-role
  namespace: netcafe
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["netcafe-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netcafe-app-rolebinding
  namespace: netcafe
subjects:
  - kind: ServiceAccount
    name: netcafe-app-sa
    namespace: netcafe
roleRef:
  kind: Role
  name: netcafe-app-role
  apiGroup: rbac.authorization.k8s.io
