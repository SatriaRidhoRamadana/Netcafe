apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netcafe-pg-pvc
  namespace: netcafe
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: netcafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: netcafe
            - name: POSTGRES_USER
              value: netcafe_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netcafe-secrets
                  key: POSTGRES_APP_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: pg-run
              mountPath: /var/run/postgresql
            - name: pg-tmp
              mountPath: /tmp
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: netcafe-pg-pvc
        - name: pg-run
          emptyDir: {}
        - name: pg-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: netcafe
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
