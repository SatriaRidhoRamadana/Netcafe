apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcafe-app
  namespace: netcafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netcafe-app
  template:
    metadata:
      labels:
        app: netcafe-app
    spec:
      serviceAccountName: netcafe-app-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netcafe-app
          image: netcafe-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netcafe-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: netcafe-secrets
                  key: SESSION_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: "384Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netcafe-app-svc
  namespace: netcafe
spec:
  type: NodePort
  selector:
    app: netcafe-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
